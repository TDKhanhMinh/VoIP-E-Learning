services:
  mongo-keyfile:
    image: mongo:8.0
    user: root
    restart: 'no'
    entrypoint: ['bash', '-c']
    command:
      - |
        if [ ! -s /keyfile/keyfile ]; then
          openssl rand -base64 756 > /keyfile/keyfile
        fi
        chown 999:999 /keyfile/keyfile
        chmod 400 /keyfile/keyfile
    volumes:
      - mongo-keyfile:/keyfile

  mongo:
    image: mongo:8.0
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    command:
      [
        'mongod',
        '--port',
        '${MONGO_PORT:-27017}',
        '--replSet',
        'rs0',
        '--keyFile',
        '/etc/mongo-keyfile/keyfile',
        '--bind_ip_all',
      ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: local-password
    ports:
      - '${MONGO_PORT:-27017}:${MONGO_PORT:-27017}'
    volumes:
      - mongo-data:/data/db
      - mongo-keyfile:/etc/mongo-keyfile:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet "mongodb://root:local-password@localhost:${MONGO_PORT:-27017}/admin?authSource=admin" --eval "db.adminCommand({ ping: 1 }).ok"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    command:
      [
        'mongosh',
        'mongodb://root:local-password@mongo:${MONGO_PORT:-27017}/admin?authSource=admin',
        '--quiet',
        '--eval',
        'try { rs.status() } catch (error) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:${MONGO_PORT:-27017}" }] }) }; while (!db.hello().isWritablePrimary) { sleep(500) }',
      ]

volumes:
  mongo-data:
  mongo-keyfile:
