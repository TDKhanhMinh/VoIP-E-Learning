name: Backend Remake CI

on:
  push:
    paths:
      - "backend-remake/**"
      - ".github/workflows/backend-remake-ci.yml"
  pull_request:
    paths:
      - "backend-remake/**"
      - ".github/workflows/backend-remake-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGO_ENABLED: true
      MONGO_URI: mongodb://root:local-password@localhost:27017/voip_elearning_test?authSource=admin&replicaSet=rs0
      MONGO_AUTO_INDEX: true
      JWT_ACCESS_SECRET: ci-access-secret-that-is-never-used-outside-tests-12345
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-never-used-outside-tests-12345
      JWT_ISSUER: voip-elearning-api-test
      JWT_AUDIENCE: voip-elearning-client-test
    defaults:
      run:
        working-directory: backend-remake

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-remake/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start MongoDB replica set
        run: npm run infra:up

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check formatting
        run: npm run format:check

      - name: Check Phase 00 security contracts
        run: npm run security:check

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:ci

      - name: MongoDB repository integration tests
        run: npm run test:integration

      - name: HTTP E2E contract tests
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Full source and test typecheck
        run: npx tsc --noEmit

      - name: Docker build
        run: docker build --tag backend-remake:ci .

      - name: Stop MongoDB replica set
        if: always()
        run: docker compose down --volumes
